<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mattannechari.co</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #f6f4f0;
    --card: rgba(255, 255, 255, 0.85);
    --text: #1a1a1a;
    --sub: #5a5f6e;
    --accent: #2d6abf;
    --border: rgba(255, 255, 255, 0.5);
    --hover-lift: -4px;
    --radius: 14px;
  }

  body {
    font-family: 'DM Sans', sans-serif;
    background: linear-gradient(160deg, #7b4fa0 0%, #c5628a 30%, #e8855c 60%, #f2a848 100%);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 48px 20px 80px;
    -webkit-font-smoothing: antialiased;
  }

  /* subtle grain texture */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    opacity: 0.3;
    pointer-events: none;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
  }

  .container {
    width: 100%;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 32px;
  }

  /* Profile Section */
  .profile {
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    animation: fadeUp 0.6s ease both;
  }

  .avatar {
    width: 88px;
    height: 88px;
    border-radius: 50%;
    object-fit: cover;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
  }

  .profile h1 {
    font-family: 'DM Serif Display', serif;
    font-size: 26px;
    font-weight: 400;
    letter-spacing: 1px;
    color: #fff;
  }

  .profile p {
    color: rgba(255, 255, 255, 0.8);
    font-size: 14px;
    line-height: 1.6;
    max-width: 300px;
  }

  /* Links */
  .links {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .link-card {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 16px 20px;
    background: var(--card);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    text-decoration: none;
    color: var(--text);
    transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
    position: relative;
    overflow: hidden;
  }

  .link-card:hover {
    transform: translateY(var(--hover-lift));
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.06);
    border-color: var(--accent);
  }

  .link-card::after {
    content: '→';
    position: absolute;
    right: 20px;
    font-size: 16px;
    color: var(--sub);
    transition: transform 0.25s ease, color 0.25s ease;
  }

  .link-card:hover::after {
    transform: translateX(4px);
    color: var(--accent);
  }

  .link-icon {
    width: 40px;
    height: 40px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    flex-shrink: 0;
  }

  .link-text h3 {
    font-size: 15px;
    font-weight: 500;
    margin-bottom: 2px;
  }

  .link-text span {
    font-size: 12px;
    color: var(--sub);
  }

  /* Icon color themes */
  .icon-linkedin  { background: #e8f0fe; color: #0a66c2; }
  .icon-substack  { background: #fff3e6; color: #ff6719; }
  .icon-instagram { background: #fce4ec; color: #c13584; }
  .icon-x         { background: #ededf0; color: #444; }
  .icon-music     { background: #fce4ec; color: #c94060; }
  .icon-email     { background: #e6f4ea; color: #2d8a4e; }

  /* Staggered entrance */
  .link-card:nth-child(1) { animation: fadeUp 0.5s 0.15s ease both; }
  .link-card:nth-child(2) { animation: fadeUp 0.5s 0.25s ease both; }
  .link-card:nth-child(3) { animation: fadeUp 0.5s 0.35s ease both; }
  .link-card:nth-child(4) { animation: fadeUp 0.5s 0.45s ease both; }
  .link-card:nth-child(5) { animation: fadeUp 0.5s 0.55s ease both; }
  .link-card:nth-child(6) { animation: fadeUp 0.5s 0.65s ease both; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* Footer */
  .footer {
    font-size: 11px;
    color: rgba(255, 255, 255, 0.5);
    letter-spacing: 1.5px;
    text-transform: uppercase;
    animation: fadeUp 0.5s 0.8s ease both;
  }

  /* Active press state */
  .link-card:active {
    transform: scale(0.985);
    transition: transform 0.1s ease;
  }
</style>
</head>
<body>

    <div class="profile">

  </div>
</body>
</html>
